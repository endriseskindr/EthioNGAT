name: Build ንጋት Ethiopia APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:   # ✋ Manual trigger button in GitHub Actions tab

jobs:
  build-apk:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle & Build
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
          arguments: assembleDebug
          build-root-directory: .   # = repo root = Android project root
          cache-write-only: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Verify APK exists
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            SIZE=$(ls -lh "$APK_PATH" | awk '{print $5}')
            echo "✅ APK built successfully: $APK_PATH ($SIZE)"
          else
            echo "❌ APK not found!"
            ls -R app/build/outputs/ 2>/dev/null || true
            exit 1
          fi

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: nigat-ethiopia-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
